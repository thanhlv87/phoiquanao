<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nhật ký thời trang tối giản: lưu trang phục hàng ngày, xem lại theo lịch và thời tiết." />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Outfit Log">
    <title>Outfit Log</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/thanhlv87/pic/refs/heads/main/fashion.png" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/thanhlv87/pic/refs/heads/main/fashion.png" />
    <link rel="manifest" href="/manifest.json">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="font-sans">
    <div id="root"></div>
    <script>
      // Áp màu đã chọn trước khi React vẽ, nếu không màn hình sẽ loé màu mặc
      // định rồi mới đổi. Bảng màu trùng với THEME_PRESETS trong hooks/useTheme.
      (function () {
        var P = {
          indigo: ['238 242 255','224 231 255','199 210 254','99 102 241','79 70 229','67 56 202','55 48 163','#4f46e5'],
          violet: ['245 243 255','237 233 254','221 214 254','139 92 246','124 58 237','109 40 217','91 33 182','#7c3aed'],
          rose: ['255 241 242','255 228 230','254 205 211','244 63 94','225 29 72','190 18 60','159 18 57','#e11d48'],
          orange: ['255 247 237','255 237 213','254 215 170','249 115 22','234 88 12','194 65 12','154 52 18','#ea580c'],
          emerald: ['236 253 245','209 250 229','167 243 208','16 185 129','5 150 105','4 120 87','6 95 70','#059669'],
          sky: ['240 249 255','224 242 254','186 230 253','14 165 233','2 132 199','3 105 161','7 89 133','#0284c7'],
          graphite: ['250 250 250','244 244 245','228 228 231','113 113 122','82 82 91','63 63 70','39 39 42','#3f3f46']
        };
        try {
          var v = P[localStorage.getItem('outfit-log:theme')];
          if (!v) return;
          var names = ['50','100','200','500','600','700','800'];
          for (var i = 0; i < names.length; i++) {
            document.documentElement.style.setProperty('--brand-' + names[i], v[i]);
          }
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', v[7]);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
